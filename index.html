<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cool Contact Form</title>

  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(
      -45deg,
      #4f46e5,
      #06b6d4,
      #7c3aed,
      #0ea5e9
    );
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    position: relative;
  }

  /* Floating glowing circles */
  body::before,
  body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
  }

  body::before {
    width: 300px;
    height: 300px;
    background: rgba(255, 255, 255, 0.2);
    top: -100px;
    left: -100px;
  }

  body::after {
    width: 250px;
    height: 250px;
    background: rgba(0, 255, 255, 0.2);
    bottom: -80px;
    right: -80px;
  }

  .form-container {
    position: relative;
    z-index: 1;
    width: 420px;
    padding: 35px;
    border-radius: 24px;

    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    border: 1px solid rgba(255, 255, 255, 0.25);

    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.2),
      0 0 40px rgba(255, 255, 255, 0.1);

    animation: fadeIn 0.8s ease;
    transition: 0.4s ease;
  }

  .form-container:hover {
    transform: translateY(-6px);
    box-shadow:
      0 20px 50px rgba(0, 0, 0, 0.25),
      0 0 50px rgba(99, 102, 241, 0.3);
  }

  .form-container h2 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 28px;
    font-weight: 700;

    background: linear-gradient(
      135deg,
      #ffffff,
      #dbeafe
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  label {
    display: block;
    margin-bottom: 18px;
    color: white;
    font-weight: 600;
  }

  input,
  textarea {
    width: 100%;
    padding: 14px;
    margin-top: 8px;

    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.2);

    background: rgba(255, 255, 255, 0.12);
    color: white;

    outline: none;
    transition: all 0.3s ease;
    font-size: 15px;
  }

  input::placeholder,
  textarea::placeholder {
    color: rgba(255, 255, 255, 0.7);
  }

  input:hover,
  textarea:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  input:focus,
  textarea:focus {
    border-color: #fff;
    background: rgba(255, 255, 255, 0.2);

    box-shadow:
      0 0 0 4px rgba(255, 255, 255, 0.15),
      0 0 20px rgba(255, 255, 255, 0.2);
  }

  textarea {
    resize: none;
    height: 120px;
  }

  button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;

    background: linear-gradient(
      135deg,
      #ffffff,
      #dbeafe
    );

    color: #4f46e5;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    position: relative;
    overflow: hidden;

    transition: all 0.3s ease;
  }

  button::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;

    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.6),
      transparent
    );

    transition: 0.7s;
  }

  button:hover::before {
    left: 100%;
  }

  button:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 10px 25px rgba(255,255,255,0.25);
  }

  @keyframes gradientMove {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(25px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (max-width: 450px) {
    .form-container {
      width: 92%;
      padding: 25px;
    }

    .form-container h2 {
      font-size: 24px;
    }
  }
</style>
</head>

<body>

  <div class="form-container">
    <h2>Punten Clusteroverleg 12.10.26</h2>

    <form
      action="https://formspree.io/f/xredznjw"
      method="POST"
    >
      <label>
        Your email:
        <input type="email" name="email" placeholder="Enter your email" required>
      </label>

      <label>
        Your message:
        <textarea name="message" placeholder="Write your message..." required></textarea>
      </label>

      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
